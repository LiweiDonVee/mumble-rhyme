[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mumble-rhyme"
version = "0.1.0"
description = "Local, soft phonetic rhyme ranking and English lyric suggestions via CLI and MCP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["songwriting", "rhyme", "phonetics", "mcp", "lyrics", "qwen"]
requires-python = ">=3.10"
dependencies = ["cmudict==1.1.3", "PyYAML>=6,<7", "pydantic>=2.11,<3", "mcp==1.27.1"]

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==5.20.2", "accelerate>=1.12,<2", "bitsandbytes==0.50.2", "huggingface-hub>=1,<2", "filelock>=3.20,<5"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2", "ruff>=0.14", "filelock>=3.20,<5"]

[project.urls]
Homepage = "https://github.com/LiweiDonVee/mumble-rhyme"
Repository = "https://github.com/LiweiDonVee/mumble-rhyme"
Issues = "https://github.com/LiweiDonVee/mumble-rhyme/issues"

[project.scripts]
mumble-rhyme = "mumble_rhyme.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.sdist]
exclude = ["/docs/superpowers", "/.cache", "/.venv", "/dist"]
